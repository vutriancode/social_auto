version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campaign_mongodb
    ports:
      - "27099:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: campaign_redis
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campaign_backend_api
    ports:
      - "8099:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_NAME=social_campaign_db
      - JWT_SECRET=supersecretkeyforcampaignmanagementsystem123456!
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
      - redis

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campaign_backend_worker
    command: python -m app.workers.worker
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_NAME=social_campaign_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api_autosocial.hikariwatch.com
    container_name: campaign_frontend
    ports:
      - "3099:3000"
    depends_on:
      - backend-api

volumes:
  mongodb_data:
  redis_data:
